# Her push ve pull request'te testleri GitHub'ın makinelerinde çalıştırır.
name: test

on:
  push:
  pull_request:

# Bu iş yalnız kodu okur; repoya yazma izni verilmez.
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...